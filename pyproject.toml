[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-aware-prototype"
version = "0.1.0"
description = "SARP: Structure-Aware Reasoning Prototype with graph planning and reproducible experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
sarp = "structure_aware.generalization:main"
structure-aware = "structure_aware.experiments:main"

[tool.setuptools.packages.find]
include = ["structure_aware*"]
