[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-aware-prototype"
version = "0.1.0"
description = "Reproducible CPU simulation of a shared structure-aware execution planner"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
structure-aware = "structure_aware.experiments:main"

[tool.setuptools.packages.find]
include = ["structure_aware*"]
