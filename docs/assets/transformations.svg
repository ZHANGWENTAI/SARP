<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title">
<title id="title">SARP 范围收缩与节点合并示意</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172b4d} .muted{fill:#52657a} .edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} </style>
<rect width="100%" height="100%" fill="white"/>
<text x="700" y="49" text-anchor="middle" font-size="32" font-weight="700" class="">执行变换：范围收缩与节点合并</text>
<text x="700" y="84" text-anchor="middle" font-size="22" font-weight="400" class="muted">示例：x 更新，y 不变；保留所需输出，减少重算与重复计算。</text>
<rect x="30" y="120" width="400" height="415" rx="12" fill="#fafcfe" stroke="#b7c8d9" stroke-width="2"/>
<text x="230" y="159" text-anchor="middle" font-size="25" font-weight="700" class="">原始计算图</text>
<path d="M 110 278 L 165 233" class="edge"/>
<path d="M 110 278 L 165 333" class="edge"/>
<path d="M 265 233 L 310 233" class="edge"/>
<path d="M 265 333 L 310 333" class="edge"/>
<path d="M 110 438 L 165 438" class="edge"/>
<rect x="50" y="255" width="60" height="46" rx="8" fill="#ffe6df" stroke="#dcad9f" stroke-width="2"/>
<text x="80" y="286" text-anchor="middle" font-size="24" font-weight="700" class="">x</text>
<rect x="165" y="210" width="100" height="46" rx="8" fill="#edf4fc" stroke="#b7c8d9" stroke-width="2"/>
<text x="215" y="241" text-anchor="middle" font-size="23" font-weight="400" class="">f(x)</text>
<rect x="165" y="310" width="100" height="46" rx="8" fill="#edf4fc" stroke="#b7c8d9" stroke-width="2"/>
<text x="215" y="341" text-anchor="middle" font-size="23" font-weight="400" class="">f(x)</text>
<rect x="310" y="210" width="90" height="46" rx="8" fill="#edf4fc" stroke="#b7c8d9" stroke-width="2"/>
<text x="355" y="241" text-anchor="middle" font-size="23" font-weight="400" class="">g</text>
<rect x="310" y="310" width="90" height="46" rx="8" fill="#edf4fc" stroke="#b7c8d9" stroke-width="2"/>
<text x="355" y="341" text-anchor="middle" font-size="23" font-weight="400" class="">h</text>
<rect x="50" y="415" width="60" height="46" rx="8" fill="#edf4fc" stroke="#b7c8d9" stroke-width="2"/>
<text x="80" y="446" text-anchor="middle" font-size="24" font-weight="400" class="">y</text>
<rect x="165" y="415" width="100" height="46" rx="8" fill="#edf4fc" stroke="#b7c8d9" stroke-width="2"/>
<text x="215" y="446" text-anchor="middle" font-size="23" font-weight="400" class="">k(y)</text>
<text x="230" y="507" text-anchor="middle" font-size="20" font-weight="400" class="muted">两个分支重复计算 f(x)</text>
<rect x="500" y="120" width="400" height="415" rx="12" fill="#fafcfe" stroke="#b7c8d9" stroke-width="2"/>
<text x="700" y="159" text-anchor="middle" font-size="25" font-weight="700" class="">确定重算范围</text>
<path d="M 580 278 L 635 233" class="edge"/>
<path d="M 580 278 L 635 333" class="edge"/>
<path d="M 735 233 L 780 233" class="edge"/>
<path d="M 735 333 L 780 333" class="edge"/>
<path d="M 580 438 L 635 438" class="edge"/>
<rect x="520" y="255" width="60" height="46" rx="8" fill="#ffe6df" stroke="#dcad9f" stroke-width="2"/>
<text x="550" y="286" text-anchor="middle" font-size="24" font-weight="700" class="">x</text>
<rect x="635" y="210" width="100" height="46" rx="8" fill="#e2f0e8" stroke="#b7c8d9" stroke-width="2"/>
<text x="685" y="241" text-anchor="middle" font-size="23" font-weight="400" class="">f(x)</text>
<rect x="635" y="310" width="100" height="46" rx="8" fill="#e2f0e8" stroke="#b7c8d9" stroke-width="2"/>
<text x="685" y="341" text-anchor="middle" font-size="23" font-weight="400" class="">f(x)</text>
<rect x="780" y="210" width="90" height="46" rx="8" fill="#e2f0e8" stroke="#b7c8d9" stroke-width="2"/>
<text x="825" y="241" text-anchor="middle" font-size="23" font-weight="400" class="">g</text>
<rect x="780" y="310" width="90" height="46" rx="8" fill="#e2f0e8" stroke="#b7c8d9" stroke-width="2"/>
<text x="825" y="341" text-anchor="middle" font-size="23" font-weight="400" class="">h</text>
<rect x="520" y="415" width="60" height="46" rx="8" fill="#edf0f4" stroke="#b7c8d9" stroke-width="2"/>
<text x="550" y="446" text-anchor="middle" font-size="24" font-weight="400" class="">y</text>
<rect x="635" y="415" width="100" height="46" rx="8" fill="#edf0f4" stroke="#b7c8d9" stroke-width="2"/>
<text x="685" y="446" text-anchor="middle" font-size="23" font-weight="400" class="">k(y)</text>
<text x="815" y="445" text-anchor="middle" font-size="21" font-weight="400" class="muted">复用缓存</text>
<text x="700" y="507" text-anchor="middle" font-size="20" font-weight="400" class="muted">只重算受 x 变化影响的节点</text>
<rect x="970" y="120" width="400" height="415" rx="12" fill="#fafcfe" stroke="#b7c8d9" stroke-width="2"/>
<text x="1170" y="159" text-anchor="middle" font-size="25" font-weight="700" class="">合并相同表达式</text>
<path d="M 1050 278 L 1105 278" class="edge"/>
<path d="M 1205 278 L 1250 233" class="edge"/>
<path d="M 1205 278 L 1250 333" class="edge"/>
<path d="M 1050 438 L 1105 438" class="edge"/>
<rect x="990" y="255" width="60" height="46" rx="8" fill="#ffe6df" stroke="#dcad9f" stroke-width="2"/>
<text x="1020" y="286" text-anchor="middle" font-size="24" font-weight="700" class="">x</text>
<rect x="1105" y="255" width="100" height="46" rx="8" fill="#eee7f6" stroke="#b7c8d9" stroke-width="2"/>
<text x="1155" y="286" text-anchor="middle" font-size="23" font-weight="400" class="">f(x)</text>
<rect x="1250" y="210" width="90" height="46" rx="8" fill="#edf4fc" stroke="#b7c8d9" stroke-width="2"/>
<text x="1295" y="241" text-anchor="middle" font-size="23" font-weight="400" class="">g</text>
<rect x="1250" y="310" width="90" height="46" rx="8" fill="#edf4fc" stroke="#b7c8d9" stroke-width="2"/>
<text x="1295" y="341" text-anchor="middle" font-size="23" font-weight="400" class="">h</text>
<rect x="990" y="415" width="60" height="46" rx="8" fill="#edf0f4" stroke="#b7c8d9" stroke-width="2"/>
<text x="1020" y="446" text-anchor="middle" font-size="24" font-weight="400" class="">y</text>
<rect x="1105" y="415" width="100" height="46" rx="8" fill="#edf0f4" stroke="#b7c8d9" stroke-width="2"/>
<text x="1155" y="446" text-anchor="middle" font-size="23" font-weight="400" class="">k(y)</text>
<text x="1285" y="445" text-anchor="middle" font-size="21" font-weight="400" class="muted">复用缓存</text>
<text x="1170" y="507" text-anchor="middle" font-size="20" font-weight="400" class="muted">f(x) 执行一次，供 g、h 使用</text>
<path d="M 438 320 L 487 320" class="edge"/>
<path d="M 908 320 L 957 320" class="edge"/>
<text x="700" y="580" text-anchor="middle" font-size="23" font-weight="400" class="muted">范围决策确定“算哪些”，分组决策确定“哪些计算可以只做一次”。</text>
</svg>
